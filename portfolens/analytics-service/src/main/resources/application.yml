spring:
  application:
    name: portfolens-analytics
  datasource:
    driver-class-name: org.postgresql.Driver
    # AnalyticsDatabaseConfiguration applies ANALYTICS_DB_POOL_* and DB_POOL_*.
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: ${DB_SCHEMA:public}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  port: ${ANALYTICS_SERVER_PORT:8002}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:portfolens.events}
    queue: ${ANALYTICS_QUEUE:portfolens.analytics.transactions}
    routing-key: ${RABBITMQ_TRANSACTION_ROUTING_KEY:portfolio.transaction.recorded}
  service-key: ${ANALYTICS_SERVICE_KEY:}
  market-data-url: ${MARKET_DATA_SERVICE_URL:http://localhost:8001}
  market-data-service-key: ${MARKET_DATA_SERVICE_KEY:}
  risk-free-annual-rate: ${ANALYTICS_RISK_FREE_ANNUAL_RATE:}
