server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /runtime-config.js { add_header Cache-Control 'no-store'; try_files $uri =404; }
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/ { proxy_pass http://workflow-coordinator:8003/api/v1/; }
    location / { try_files $uri $uri/ /index.html; }
}
