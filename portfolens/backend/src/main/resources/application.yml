spring:
  application:
    name: portfolens
  datasource:
    # DatabaseUrlConfiguration normalizes Supabase URI and JDBC formats and
    # extracts URL credentials for Hikari. Split variables are also supported.
    driver-class-name: org.postgresql.Driver
    # The datasource bean applies the DB_POOL_* settings to its Hikari instance.
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: ${DB_SCHEMA:public}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
server:
  # Keep Docker/Kubernetes at 8000 via SERVER_PORT, while a direct local run
  # can coexist with the Compose gateway published on host port 8000.
  port: ${SERVER_PORT:8009}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  market-data:
    base-url: ${MARKET_DATA_SERVICE_URL:http://localhost:8001}
    sync-key: ${MARKET_SYNC_KEY:}
    service-key: ${MARKET_DATA_SERVICE_KEY:}
  messaging:
    exchange: ${RABBITMQ_EXCHANGE:portfolens.events}
    transaction-routing-key: ${RABBITMQ_TRANSACTION_ROUTING_KEY:portfolio.transaction.recorded}
    outbox-poll-ms: ${OUTBOX_POLL_MS:1000}
  analytics:
    base-url: ${ANALYTICS_SERVICE_URL:http://localhost:8002}
    service-key: ${ANALYTICS_SERVICE_KEY:}
