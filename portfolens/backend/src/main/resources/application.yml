spring:
  application:
    name: portfolens
  datasource:
    # DatabaseUrlConfiguration normalizes Supabase URI and JDBC formats and
    # extracts URL credentials for Hikari. Split variables are also supported.
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: ${DB_SCHEMA:public}
server:
  port: ${SERVER_PORT:8000}
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  market-data:
    base-url: ${MARKET_DATA_SERVICE_URL:http://localhost:8001}
    sync-key: ${MARKET_SYNC_KEY:}
