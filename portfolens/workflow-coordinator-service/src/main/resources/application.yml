spring:
  application:
    name: workflow-coordinator-service
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: ${WORKFLOW_DB_SCHEMA:workflow}
  flyway:
    enabled: true
    default-schema: ${WORKFLOW_DB_SCHEMA:workflow}
    schemas: ${WORKFLOW_DB_SCHEMA:workflow}
    create-schemas: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
server:
  port: ${WORKFLOW_SERVER_PORT:8003}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
  saga:
    portfolio-base-url: ${PORTFOLIO_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${SAGA_CONNECT_TIMEOUT:3s}
    response-timeout: ${SAGA_RESPONSE_TIMEOUT:10s}
    max-retries: ${SAGA_MAX_RETRIES:3}
    initial-retry-delay: ${SAGA_INITIAL_RETRY_DELAY:1s}
    max-retry-delay: ${SAGA_MAX_RETRY_DELAY:30s}
    retry-multiplier: ${SAGA_RETRY_MULTIPLIER:2.0}
    recovery-interval: ${SAGA_RECOVERY_INTERVAL:5000}
    lease-duration: ${SAGA_LEASE_DURATION:30s}
