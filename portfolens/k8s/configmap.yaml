apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolens-config
  namespace: portfolens
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  APP_CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
  MARKET_DATA_SERVICE_URL: "http://market-data-service:8001"
  MARKET_DATA_DIR: "/data"
  PORTFOLENS_STOCKS_FILE: "/app/data/stocks.csv"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8002"
  PORTFOLIO_SERVICE_URL: "http://api-gateway:8000"
  DB_SCHEMA: "public"
  ANALYTICS_DB_SCHEMA: "public"
  WORKFLOW_DB_SCHEMA: "workflow"
  # Keep max pooled DB sessions below Supabase's session pool cap during rolling updates.
  DB_POOL_MAX_SIZE: "1"
  DB_POOL_MIN_IDLE: "1"
  ANALYTICS_DB_POOL_MAX_SIZE: "1"
  ANALYTICS_DB_POOL_MIN_IDLE: "1"
  WORKFLOW_DB_POOL_MAX_SIZE: "1"
  WORKFLOW_DB_POOL_MIN_IDLE: "1"
  DB_POOL_CONNECTION_TIMEOUT_MS: "30000"
  DB_POOL_IDLE_TIMEOUT_MS: "300000"
  DB_POOL_MAX_LIFETIME_MS: "1200000"
  SAGA_RECOVERY_INTERVAL: "5000ms"
  SAGA_LEASE_DURATION: "30s"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError"
  RABBITMQ_PORT: "5672"
