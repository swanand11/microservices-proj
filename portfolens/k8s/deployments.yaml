apiVersion: apps/v1
kind: Deployment
metadata: { name: workflow-coordinator, namespace: portfolens }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: workflow-coordinator } }
  template:
    metadata: { labels: { app: workflow-coordinator } }
    spec:
      serviceAccountName: portfolens-app
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: workflow-coordinator
          image: portfolens-workflow-coordinator:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8003 }]
          envFrom:
            - configMapRef: { name: portfolens-config }
            - secretRef: { name: portfolens-secrets }
          env:
            - { name: WORKFLOW_SERVER_PORT, value: "8003" }
            # Flyway needs its own temporary connection; keep it outside the one-connection app pool.
            - name: SPRING_FLYWAY_URL
              valueFrom: { secretKeyRef: { name: portfolens-secrets, key: DATABASE_URL } }
            - name: SPRING_FLYWAY_USER
              valueFrom: { secretKeyRef: { name: portfolens-secrets, key: DB_USER } }
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom: { secretKeyRef: { name: portfolens-secrets, key: DB_PASSWORD } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5, failureThreshold: 3 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: portfolens }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      terminationGracePeriodSeconds: 15
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: portfolens-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env: [{ name: API_BASE_URL, value: "" }]
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 3, failureThreshold: 20 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: runtime-js, mountPath: /usr/share/nginx/html/runtime-config.js, subPath: runtime-config.js, readOnly: true }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
      volumes:
        - name: runtime-js
          configMap: { name: frontend-runtime, items: [{ key: runtime-config.js, path: runtime-config.js }] }
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
