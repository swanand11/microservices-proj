apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: portfolens }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      serviceAccountName: portfolens-app
      terminationGracePeriodSeconds: 35
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api-gateway
          image: portfolens-gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: portfolens-config }
            - secretRef: { name: portfolens-secrets }
          env:
            - { name: SERVER_PORT, value: "8000" }
            - { name: RABBITMQ_PORT, value: "5672" }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: market-data-service, namespace: portfolens }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: market-data-service } }
  template:
    metadata: { labels: { app: market-data-service } }
    spec:
      serviceAccountName: portfolens-app
      terminationGracePeriodSeconds: 20
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: market-data
          image: portfolens-market-data:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: portfolens-config }
          env:
            - { name: PORTFOLENS_STOCKS_FILE, value: /app/data/stocks.csv }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: portfolens-secrets, key: DATABASE_URL } } }
            - { name: MARKET_DATABASE_URL, valueFrom: { secretKeyRef: { name: portfolens-secrets, key: DATABASE_URL } } }
            - { name: MARKET_DATA_SERVICE_KEY, valueFrom: { secretKeyRef: { name: portfolens-secrets, key: MARKET_DATA_SERVICE_KEY } } }
          startupProbe: { httpGet: { path: /api/market/health, port: http }, periodSeconds: 5, failureThreshold: 20 }
          livenessProbe: { httpGet: { path: /api/market/health, port: http }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /api/market/health, port: http }, periodSeconds: 5, failureThreshold: 3 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 750m, memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: cache, mountPath: /data }]
      volumes: [{ name: cache, emptyDir: {} }]
---
