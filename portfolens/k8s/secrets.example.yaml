apiVersion: v1
kind: Secret
metadata:
  name: portfolens-secrets
  namespace: portfolens
type: Opaque
stringData:
  DATABASE_URL: "jdbc:postgresql://db.example.supabase.co:5432/postgres?sslmode=require"
  DB_USER: "postgres.project-ref"
  DB_PASSWORD: "replace-with-your-supabase-database-password"
  JWT_SECRET: "replace-with-base64-encoded-random-key"
  MARKET_DATA_SERVICE_KEY: "replace-with-random-key"
  ANALYTICS_SERVICE_KEY: "replace-with-random-key"
  # Must resolve from inside the cluster. Compose's hostname "rabbitmq" is not suitable here.
  RABBITMQ_HOST: "replace-with-cluster-reachable-broker"
  RABBITMQ_USERNAME: "replace-with-broker-username"
  RABBITMQ_PASSWORD: "replace-with-broker-password"
