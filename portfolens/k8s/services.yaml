apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: portfolens }
spec:
  selector: { app: api-gateway }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: market-data-service, namespace: portfolens }
spec:
  selector: { app: market-data-service }
  ports: [{ name: http, port: 8001, targetPort: 8001 }]
---
apiVersion: v1
kind: Service
metadata: { name: analytics-service, namespace: portfolens }
spec:
  selector: { app: analytics-service }
  ports: [{ name: http, port: 8002, targetPort: 8002 }]
---
apiVersion: v1
kind: Service
metadata: { name: workflow-coordinator, namespace: portfolens }
spec:
  selector: { app: workflow-coordinator }
  ports: [{ name: http, port: 8003, targetPort: 8003 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: portfolens }
spec:
  selector: { app: frontend }
  # Matches the local Kind hostPort mapping; checked free in the current Minikube cluster.
  type: NodePort
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 30080 }
