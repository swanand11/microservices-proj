apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolens
  namespace: portfolens
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: portfolens.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 8080 } } }
